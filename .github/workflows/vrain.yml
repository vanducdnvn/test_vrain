name: Thu thập dữ liệu Vrain

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vrain-hourly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Playwright và trình duyệt
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Cào dữ liệu Vrain
        run: python scripts/scrape_vrain.py

      - name: Lưu CSV lên repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vrain_hourly.csv
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
          else
            git commit -m "Cập nhật dữ liệu mưa Vrain"
            git push
          fi
